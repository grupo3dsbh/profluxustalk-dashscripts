<script>
(function() {
  'use strict';

  // ============================================================
  // PROFLUXUS CONFIG - GERENCIADOR DE WHATSAPP E NOTIFICAÇÕES
  // ============================================================
  // Adiciona campos para configurar WhatsApp e tipo de uso do ProFluxus
  // - Na página de perfil: usuário edita telefone, visualiza tipo de uso
  // - Na lista de agentes: admin edita telefone e tipo de uso
  // ============================================================

  console.log('📱 ProFluxus Config carregado!');

  // ============================================================
  // CONFIGURAÇÕES
  // ============================================================

  const CONFIG = {
    opcoes_uso: [
      { value: 'receber_leads', label: 'Receber Leads' },
      { value: 'notificacoes_profluxus', label: 'Notificações ProFluxus' }
    ]
  };

  // Cache de dados dos agentes
  let agentesCache = {};

  // ============================================================
  // FUNÇÕES DE API
  // ============================================================

  /**
   * Pega o account_id da URL atual
   * @returns {string|null} Account ID ou null
   */
  function getAccountId() {
    const match = window.location.pathname.match(/\/accounts\/(\d+)/);
    return match ? match[1] : null;
  }

  /**
   * Pega o auth token do Chatwoot
   * @returns {string|null} Token ou null
   */
  function getAuthToken() {
    // Tenta pegar do localStorage
    const keys = Object.keys(localStorage);
    for (const key of keys) {
      if (key.includes('auth') || key.includes('token')) {
        try {
          const data = JSON.parse(localStorage.getItem(key));
          if (data && data.token) {
            return data.token;
          }
        } catch (e) {
          // Ignora erros de parse
        }
      }
    }

    // Tenta pegar de cookies
    const cookies = document.cookie.split(';');
    for (const cookie of cookies) {
      const [name, value] = cookie.trim().split('=');
      if (name.includes('auth') || name.includes('token')) {
        return value;
      }
    }

    return null;
  }

  /**
   * Faz uma chamada para a API do Chatwoot
   * @param {string} endpoint - Endpoint da API
   * @param {string} method - Método HTTP
   * @param {object} data - Dados para enviar
   * @returns {Promise<object>} Resposta da API
   */
  async function chatwootAPI(endpoint, method = 'GET', data = null) {
    const token = getAuthToken();
    const baseURL = window.location.origin;

    const options = {
      method: method,
      headers: {
        'Content-Type': 'application/json',
      },
      credentials: 'include'
    };

    if (token) {
      options.headers['Authorization'] = `Bearer ${token}`;
    }

    if (data && (method === 'POST' || method === 'PUT' || method === 'PATCH')) {
      options.body = JSON.stringify(data);
    }

    const response = await fetch(`${baseURL}${endpoint}`, options);

    if (!response.ok) {
      throw new Error(`API Error: ${response.status}`);
    }

    return await response.json();
  }

  /**
   * Busca os dados do usuário atual
   * @returns {Promise<object>} Dados do usuário
   */
  async function getCurrentUser() {
    return await chatwootAPI('/api/v1/profile');
  }

  /**
   * Busca a lista de agentes
   * @param {number} accountId - ID da conta
   * @returns {Promise<Array>} Lista de agentes
   */
  async function getAgents(accountId) {
    return await chatwootAPI(`/api/v1/accounts/${accountId}/agents`);
  }

  /**
   * Atualiza os custom_attributes do usuário
   * @param {number} accountId - ID da conta
   * @param {number} userId - ID do usuário
   * @param {object} customAttributes - Atributos personalizados
   * @returns {Promise<object>} Resposta da API
   */
  async function updateUserAttributes(accountId, userId, customAttributes) {
    return await chatwootAPI(
      `/api/v1/accounts/${accountId}/agents/${userId}`,
      'PATCH',
      { custom_attributes: customAttributes }
    );
  }

  // ============================================================
  // FUNÇÕES DE ATRIBUTOS
  // ============================================================

  /**
   * Pega os atributos do ProFluxus para uma conta específica
   * @param {object} customAttributes - Custom attributes do usuário
   * @param {string} accountId - ID da conta
   * @returns {object} Atributos { whatsapp, uso_profluxus }
   */
  function getProFluxusAttrs(customAttributes, accountId) {
    const key = `account_${accountId}`;

    if (!customAttributes || !customAttributes[key]) {
      return {
        whatsapp: '',
        uso_profluxus: 'receber_leads'
      };
    }

    return {
      whatsapp: customAttributes[key].whatsapp || '',
      uso_profluxus: customAttributes[key].uso_profluxus || 'receber_leads'
    };
  }

  /**
   * Atualiza os atributos do ProFluxus
   * @param {object} customAttributes - Custom attributes do usuário
   * @param {string} accountId - ID da conta
   * @param {object} attrs - Novos atributos { whatsapp, uso_profluxus }
   * @returns {object} Custom attributes atualizado
   */
  function setProFluxusAttrs(customAttributes, accountId, attrs) {
    const key = `account_${accountId}`;

    const updated = { ...customAttributes };

    updated[key] = {
      whatsapp: attrs.whatsapp,
      uso_profluxus: attrs.uso_profluxus
    };

    return updated;
  }

  // ============================================================
  // MODAL DE EDIÇÃO
  // ============================================================

      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 10000;
      align-items: center;
      justify-content: center;
    `;

    modal.innerHTML = `
      <div id="profluxus-modal-content" style="
        background-color: white;
        border-radius: 12px;
        padding: 32px;
        max-width: 500px;
        width: 90%;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      ">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">

          </h2>
          <button id="profluxus-modal-close" style="
            background: none;
            border: none;
            font-size: 24px;

            color: #6b7280;

            justify-content: center;

          " onmouseover="this.style.backgroundColor='#f3f4f6'" onmouseout="this.style.backgroundColor='transparent'">
            ×
          </button>
        </div>

        <div style="margin-bottom: 20px;">
          <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #374151;">
            Agente
          </label>
          <input
            type="text"
            id="profluxus-modal-nome"

              background-color: #f9fafb;

          />
        </div>

        <div style="margin-bottom: 20px;">
          <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #374151;">
            WhatsApp
          </label>
          <input
            type="tel"
            id="profluxus-modal-whatsapp"
            placeholder="+55 31 99999-9999"
            style="
              width: 100%;
              padding: 10px 12px;
              border: 1px solid #d1d5db;
              border-radius: 6px;

              color: #111827;
              background-color: white;
            "
          />
          <p style="font-size: 12px; color: #6b7280; margin-top: 6px;">
            Número de WhatsApp para receber notificações
          </p>
        </div>

        <div style="margin-bottom: 24px;">
          <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #374151;">
            Tipo de Uso
          </label>
          <select
            id="profluxus-modal-uso"
            style="
              width: 100%;
              padding: 10px 12px;
              border: 1px solid #d1d5db;
              border-radius: 6px;
              font-size: 14px;
              color: #111827;

          >
            ${CONFIG.opcoes_uso.map(opt => `
              <option value="${opt.value}">${opt.label}</option>
            `).join('')}
          </select>

            Como o agente utilizará o ProFluxus
          </p>
        </div>

        <div id="profluxus-modal-message" style="margin-bottom: 20px; display: none;">
          <p style="font-size: 14px; padding: 10px; border-radius: 6px; margin: 0;"></p>
        </div>

        <div style="display: flex; gap: 12px; justify-content: flex-end;">
          <button id="profluxus-modal-cancelar" style="
            padding: 10px 20px;
            background-color: #f3f4f6;
            color: #374151;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
          " onmouseover="this.style.backgroundColor='#e5e7eb'" onmouseout="this.style.backgroundColor='#f3f4f6'">
            Cancelar
          </button>
          <button id="profluxus-modal-salvar" style="
            padding: 10px 20px;
            background-color: #7c2d12;

            cursor: pointer;
            transition: background-color 0.2s;

    // Eventos do modal
    document.getElementById('profluxus-modal-close').addEventListener('click', fecharModal);
    document.getElementById('profluxus-modal-cancelar').addEventListener('click', fecharModal);

    // Fecha ao clicar fora
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        fecharModal();
      }
    });
  }

  /**
   * Abre o modal para editar um agente
   * @param {number} userId - ID do usuário
   * @param {string} userName - Nome do usuário
   */
  async function abrirModal(userId, userName) {
    criarModal();

    const modal = document.getElementById('profluxus-modal');
    const accountId = getAccountId();

    // Busca dados do agente
    const agente = agentesCache[userId];

    if (!agente) {
      console.error('❌ Agente não encontrado no cache:', userId);
      return;
    }

    const attrs = getProFluxusAttrs(agente.custom_attributes, accountId);

    // Preenche os campos
    document.getElementById('profluxus-modal-nome').value = userName;
    document.getElementById('profluxus-modal-whatsapp').value = attrs.whatsapp;
    document.getElementById('profluxus-modal-uso').value = attrs.uso_profluxus;

    // Limpa mensagens
    document.getElementById('profluxus-modal-message').style.display = 'none';

    // Mostra o modal
    modal.style.display = 'flex';

    // Adiciona evento de salvar
    const btnSalvar = document.getElementById('profluxus-modal-salvar');

    // Remove listeners antigos
    const novoBtnSalvar = btnSalvar.cloneNode(true);
    btnSalvar.parentNode.replaceChild(novoBtnSalvar, btnSalvar);

    // Adiciona novo listener
    novoBtnSalvar.addEventListener('click', async () => {
      await salvarConfiguracoesModal(userId);
    });

    // Restaura hover
    novoBtnSalvar.addEventListener('mouseover', () => {
      novoBtnSalvar.style.backgroundColor = '#991b1b';
    });
    novoBtnSalvar.addEventListener('mouseout', () => {
      novoBtnSalvar.style.backgroundColor = '#7c2d12';
    });
  }

  /**
   * Salva as configurações do modal
   * @param {number} userId - ID do usuário
   */
  async function salvarConfiguracoesModal(userId) {
    const accountId = getAccountId();
    const whatsapp = document.getElementById('profluxus-modal-whatsapp').value.trim();
    const uso = document.getElementById('profluxus-modal-uso').value;

    const messageDiv = document.getElementById('profluxus-modal-message');
    const messageP = messageDiv.querySelector('p');

    try {
      messageDiv.style.display = 'none';

      // Busca agente do cache
      const agente = agentesCache[userId];

      if (!agente) {
        throw new Error('Agente não encontrado no cache');
      }

      // Atualiza os atributos
      const updatedAttrs = setProFluxusAttrs(
        agente.custom_attributes || {},
        accountId,
        {
          whatsapp: whatsapp,
          uso_profluxus: uso
        }
      );

      // Salva na API
      await updateUserAttributes(accountId, userId, updatedAttrs);

      // Atualiza o cache
      agente.custom_attributes = updatedAttrs;

      // Mostra mensagem de sucesso
      messageP.textContent = '✅ Configurações salvas com sucesso!';
      messageP.style.backgroundColor = '#d1fae5';
      messageP.style.color = '#065f46';
      messageDiv.style.display = 'block';

      console.log('✅ Configurações ProFluxus salvas para usuário:', userId);

      // Fecha o modal após 1.5 segundos
      setTimeout(() => {
        fecharModal();
      }, 1500);

    } catch (error) {
      console.error('❌ Erro ao salvar configurações:', error);

      messageP.textContent = '❌ Erro ao salvar configurações. Tente novamente.';
      messageP.style.backgroundColor = '#fee2e2';
      messageP.style.color = '#991b1b';
      messageDiv.style.display = 'block';
    }
  }

  /**
   * Fecha o modal
   */
  function fecharModal() {
    const modal = document.getElementById('profluxus-modal');
    if (modal) {
      modal.style.display = 'none';
    }
  }

  // ============================================================
  // INTERFACE - PÁGINA DE PERFIL
  // ============================================================

   * Adiciona seção de configuração na página de perfil
   */

    // Verifica se está na página de perfil
    if (!window.location.pathname.includes('/profile/settings')) {
      return;
    }

    console.log('📝 Adicionando seção ProFluxus no perfil...');

    // Busca o container de configurações
    const container = document.querySelector('form');

    if (!container) {
      console.log('⚠️ Container de perfil não encontrado');
      return;
    }

    // Verifica se já foi adicionado
    if (document.getElementById('profluxus-config-section')) {
      return;
    }

    const accountId = getAccountId();
    if (!accountId) {
      console.log('⚠️ Account ID não encontrado na URL');
      return;
    }

    // Busca dados do usuário
    let userData;
    try {
      userData = await getCurrentUser();
    } catch (error) {
      console.error('❌ Erro ao buscar dados do usuário:', error);

    const section = document.createElement('div');

    section.style.cssText = `
      margin-top: 32px;
      padding-top: 32px;
      border-top: 1px solid #e5e7eb;
    `;

    section.innerHTML = `
      <div style="margin-bottom: 24px;">
        <h3 style="font-size: 18px; font-weight: 600; margin-bottom: 8px; color: #111827;">
          Configurações ProFluxus
        </h3>
        <p style="font-size: 14px; color: #6b7280;">
          Configure seu WhatsApp e preferências de notificação
        </p>
      </div>

      <div style="margin-bottom: 20px;">
        <label style="display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; color: #374151;">
          WhatsApp
        </label>
        <input
          type="tel"
          id="profluxus-whatsapp"

            background-color: white;
          "
        />
        <p style="font-size: 12px; color: #6b7280; margin-top: 6px;">
          Número de WhatsApp para receber notificações
        </p>
      </div>

      <div style="margin-bottom: 20px;">
        <label style="display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; color: #374151;">
          Tipo de Uso
        </label>
        <select
          id="profluxus-uso"
          disabled
          style="
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            color: #9ca3af;

        >
          ${CONFIG.opcoes_uso.map(opt => `

              ${opt.label}

          `).join('')}
        </select>
        <p style="font-size: 12px; color: #6b7280; margin-top: 6px;">

        </p>
      </div>

      <button

          cursor: pointer;
          transition: background-color 0.2s;
        "

      >
        Salvar Configurações ProFluxus
      </button>

    // Adiciona ao container

  // ============================================================
  // INTERFACE - LISTA DE AGENTES
  // ============================================================

  /**
   * Carrega a lista de agentes e adiciona ao cache
   */
  async function carregarAgentes() {
    const accountId = getAccountId();
    if (!accountId) {
      return;
    }

    try {
      const agentes = await getAgents(accountId);

      // Adiciona ao cache
      agentes.forEach(agente => {
        agentesCache[agente.id] = agente;
      });

      console.log(`✅ ${agentes.length} agentes carregados no cache`);

    } catch (error) {
      console.error('❌ Erro ao carregar agentes:', error);
    }
  }

  /**
   * Adiciona botões de configuração na tabela de agentes
   */
  function adicionarBotoesAgentes() {
    // Verifica se está na página de agentes
    if (!window.location.pathname.includes('/settings/agents')) {
      return;
    }

    const accountId = getAccountId();
    if (!accountId) {
      return;
    }

    // Procura por emails na página (cada agente tem um email único)
    const todosElementos = document.querySelectorAll('*');

    const emailsEncontrados = new Set();

    todosElementos.forEach(el => {
      const texto = el.textContent || '';

      // Regex para email
      const emailRegex = /([a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+\.[a-zA-Z0-9_-]+)/g;
      const matches = texto.match(emailRegex);

      if (matches) {
        matches.forEach(email => {
          emailsEncontrados.add(email);
        });
      }
    });

    // Para cada email encontrado, procura o agente no cache
    emailsEncontrados.forEach(email => {
      const agente = Object.values(agentesCache).find(a => a.email === email);

      if (agente) {
        adicionarBotaoParaAgente(agente);
      }
    });
  }

  /**
   * Adiciona botão de configuração para um agente específico
   * @param {object} agente - Dados do agente
   */
  function adicionarBotaoParaAgente(agente) {
    // Procura elemento que contém o email do agente
    const todosElementos = document.querySelectorAll('*');

    for (const el of todosElementos) {
      const texto = el.textContent || '';

      if (texto.includes(agente.email)) {
        // Verifica se já tem botão
        const elementoPai = el.closest('tr, div[class*="row"], div[class*="item"]');

        if (!elementoPai) {
          continue;
        }

        if (elementoPai.querySelector('.profluxus-config-btn')) {
          continue;
        }

        // Adiciona botão
        const btnContainer = document.createElement('div');
        btnContainer.style.cssText = 'display: inline-block; margin-left: 8px;';

        const btn = document.createElement('button');
        btn.className = 'profluxus-config-btn';
        btn.innerHTML = '📱';
        btn.title = 'Configurar ProFluxus';
        btn.style.cssText = `
          padding: 6px 10px;
          background-color: #7c2d12;
          color: white;
          border: none;
          border-radius: 4px;
          font-size: 16px;
          cursor: pointer;
          transition: background-color 0.2s;
        `;

        btn.addEventListener('mouseover', () => {
          btn.style.backgroundColor = '#991b1b';
        });

        btn.addEventListener('mouseout', () => {
          btn.style.backgroundColor = '#7c2d12';
        });

        btn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();

          abrirModal(agente.id, agente.name || agente.available_name);
        });

        btnContainer.appendChild(btn);

        // Tenta adicionar ao lado do email
        if (el.parentNode) {
          el.parentNode.appendChild(btnContainer);
        }

        break;
      }
    }
  }

  // ============================================================
  // INICIALIZAÇÃO
  // ============================================================

  /**
   * Inicia o script
   */
  async function iniciar() {
    console.log('🚀 Inicializando ProFluxus Config...');

    // Cria o modal
    criarModal();

    // Aguarda um pouco para o DOM carregar
    await new Promise(resolve => setTimeout(resolve, 1000));

    // Adiciona seção no perfil
    await adicionarSecaoPerfil();

    // Se estiver na página de agentes, carrega os dados
    if (window.location.pathname.includes('/settings/agents')) {
      await carregarAgentes();
      await new Promise(resolve => setTimeout(resolve, 500));
      adicionarBotoesAgentes();
    }
  }

  // Aguarda o DOM carregar
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', iniciar);
  } else {
    iniciar();
  }

  // ============================================================
  // OBSERVER
  // ============================================================
  // Monitora mudanças no DOM para SPAs

  const observer = new MutationObserver(() => {
    adicionarSecaoPerfil();
    adicionarBotoesAgentes();
  });

  observer.observe(document.body, {
    childList: true,
    subtree: true
  });

  console.log('✨ ProFluxus Config pronto!');

})();
</script>
