  /**
   * Pega o account_id da URL atual
   * @returns {string|null} Account ID ou null
   */
  function getAccountId() {
    const match = window.location.pathname.match(/\/accounts\/(\d+)/);
    return match ? match[1] : null;
  }

  /**
   * Pega o auth token do Chatwoot de forma mais robusta
   * @returns {string|null} Token ou null
   */
  function getAuthToken() {
    // Método 1: Tenta pegar do Vuex store (mais confiável)
    try {
      if (window.$chatwoot && window.$chatwoot.store) {
        const state = window.$chatwoot.store.state;
        if (state && state.auth && state.auth.currentUser) {
          const token = state.auth.currentUser.access_token;
          if (token) {
            console.log('✅ Token obtido do Vuex store');
            return token;
          }
        }
      }
    } catch (e) {
      console.log('⚠️ Erro ao acessar Vuex store:', e);
    }

    // Método 2: Tenta pegar do localStorage do Chatwoot
    try {
      const authData = localStorage.getItem('auth');
      if (authData) {
        const parsed = JSON.parse(authData);
        if (parsed && parsed.currentUser && parsed.currentUser.access_token) {
          console.log('✅ Token obtido do localStorage auth');
          return parsed.currentUser.access_token;
        }
      }
    } catch (e) {
      console.log('⚠️ Erro ao acessar localStorage auth:', e);
    }

    // Método 3: Procura em todos os items do localStorage
    try {
      const keys = Object.keys(localStorage);
      for (const key of keys) {
        if (key.toLowerCase().includes('chatwoot') || key.toLowerCase().includes('auth')) {
          try {
            const data = JSON.parse(localStorage.getItem(key));
            if (data && data.currentUser && data.currentUser.access_token) {
              console.log('✅ Token obtido de:', key);
              return data.currentUser.access_token;
            }
          } catch (e) {
            // Ignora erros de parse
          }
        }
      }
    } catch (e) {
      console.log('⚠️ Erro ao procurar token:', e);
    }

    console.log('❌ Não foi possível obter o token de autenticação');
    return null;
  }

  /**
   * Faz uma chamada para a API do Chatwoot
   * @param {string} endpoint - Endpoint da API
   * @param {string} method - Método HTTP
   * @param {object} data - Dados para enviar
   * @returns {Promise<object>} Resposta da API
   */
  async function chatwootAPI(endpoint, method = 'GET', data = null) {
    const baseURL = window.location.origin;

    const options = {
      method: method,
      headers: {
        'Content-Type': 'application/json',
      },
      credentials: 'include'
    };

    const token = getAuthToken();
    if (token) {
      options.headers['Authorization'] = `Bearer ${token}`;
    }

    if (data && (method === 'POST' || method === 'PUT' || method === 'PATCH')) {
      options.body = JSON.stringify(data);
    }

    console.log('🌐 Chamando API:', method, endpoint);

    const response = await fetch(`${baseURL}${endpoint}`, options);

    if (!response.ok) {
      console.error('❌ Erro na API:', response.status, response.statusText);
      throw new Error(`API Error: ${response.status}`);
    }

    return await response.json();
  }

  /**
   * Busca os dados do usuário atual
   * @returns {Promise<object>} Dados do usuário
   */
  async function getCurrentUser() {
    if (currentUserData) {
      return currentUserData;
    }

    currentUserData = await chatwootAPI('/api/v1/profile');
    return currentUserData;
  }

  /**
   * Busca a lista de agentes
   * @param {number} accountId - ID da conta
   * @returns {Promise<Array>} Lista de agentes
   */
  async function getAgents(accountId) {
    return await chatwootAPI(`/api/v1/accounts/${accountId}/agents`);
  }

  /**
   * Atualiza os custom_attributes do usuário
   * @param {number} accountId - ID da conta
   * @param {number} userId - ID do usuário
   * @param {object} customAttributes - Atributos personalizados
   * @returns {Promise<object>} Resposta da API
   */
  async function updateUserAttributes(accountId, userId, customAttributes) {
    return await chatwootAPI(
      `/api/v1/accounts/${accountId}/agents/${userId}`,
      'PATCH',
      { custom_attributes: customAttributes }
    );
  }

  // ============================================================

  // ============================================================

  /**
   * Pega todos os atributos do ProFluxus
   * @param {object} customAttributes - Custom attributes do usuário
   * @param {string} accountId - ID da conta
   * @returns {object} Todos os atributos ProFluxus
   */
  function getProFluxusAttrs(customAttributes, accountId) {
    const key = `account_${accountId}`;

    const defaults = {
      whatsapp: '',
      uso_profluxus: 'receber_leads',
      chave_openai: '',
      prompt_openai: '',
      documento: '',
      api_openai: {
        url: '',
        method: 'POST'
      }
    };

    if (!customAttributes) {
      return defaults;
    }

    // Busca dados da conta específica
    const accountData = customAttributes[key] || {};

    // Busca dados globais (fallback para compatibilidade)
    const globalData = {
      whatsapp: customAttributes.whatsapp || '',
      uso_profluxus: customAttributes.uso_profluxus || 'receber_leads',
      chave_openai: customAttributes.chave_openai || '',
      prompt_openai: customAttributes.prompt_openai || '',
      documento: customAttributes.documento || '',
      api_openai: customAttributes.api_openai || { url: '', method: 'POST' }
    };

    // Merge: prioriza dados da conta, depois global, depois defaults
    return {
      whatsapp: accountData.whatsapp || globalData.whatsapp || defaults.whatsapp,
      uso_profluxus: accountData.uso_profluxus || globalData.uso_profluxus || defaults.uso_profluxus,
      chave_openai: globalData.chave_openai || defaults.chave_openai,
      prompt_openai: globalData.prompt_openai || defaults.prompt_openai,
      documento: globalData.documento || defaults.documento,
      api_openai: {
        url: (globalData.api_openai && globalData.api_openai.url) || defaults.api_openai.url,
        method: (globalData.api_openai && globalData.api_openai.method) || defaults.api_openai.method
      }
    };
  }

  /**
   * Atualiza os atributos do ProFluxus
   * @param {object} customAttributes - Custom attributes atuais
   * @param {string} accountId - ID da conta
   * @param {object} attrs - Novos atributos
   * @returns {object} Custom attributes atualizado
   */
  function setProFluxusAttrs(customAttributes, accountId, attrs) {
    const key = `account_${accountId}`;

    const updated = { ...customAttributes };

    // Atualiza dados da conta específica
    updated[key] = {
      whatsapp: attrs.whatsapp,
      uso_profluxus: attrs.uso_profluxus
    };

    // Atualiza dados globais
    updated.chave_openai = attrs.chave_openai;
    updated.prompt_openai = attrs.prompt_openai;
    updated.documento = attrs.documento;
    updated.api_openai = {
      url: attrs.api_openai.url,
      method: attrs.api_openai.method
    };

    return updated;
  }

  /**
   * Abre o modal para editar um agente
   */
  async function abrirModal(userId, userName) {
    criarModal();

    const modal = document.getElementById('profluxus-modal');
    const accountId = getAccountId();

    const agente = agentesCache[userId];

    if (!agente) {
      console.error('❌ Agente não encontrado no cache:', userId);
      return;
    }

    const attrs = getProFluxusAttrs(agente.custom_attributes, accountId);

    // Preenche os campos
    document.getElementById('profluxus-modal-nome').value = userName;
    document.getElementById('profluxus-modal-whatsapp').value = attrs.whatsapp;
    document.getElementById('profluxus-modal-uso').value = attrs.uso_profluxus;
    document.getElementById('profluxus-modal-chave-openai').value = attrs.chave_openai;
    document.getElementById('profluxus-modal-prompt-openai').value = attrs.prompt_openai;
    document.getElementById('profluxus-modal-api-url').value = attrs.api_openai.url;
    document.getElementById('profluxus-modal-api-method').value = attrs.api_openai.method;
    document.getElementById('profluxus-modal-documento').value = attrs.documento;

    document.getElementById('profluxus-modal-message').style.display = 'none';

    modal.style.display = 'flex';

    const btnSalvar = document.getElementById('profluxus-modal-salvar');
    const novoBtnSalvar = btnSalvar.cloneNode(true);
    btnSalvar.parentNode.replaceChild(novoBtnSalvar, btnSalvar);

    novoBtnSalvar.addEventListener('click', async () => {
      await salvarConfiguracoesModal(userId);
    });

    novoBtnSalvar.addEventListener('mouseover', () => {
      novoBtnSalvar.style.backgroundColor = '#991b1b';
    });
    novoBtnSalvar.addEventListener('mouseout', () => {
      novoBtnSalvar.style.backgroundColor = '#7c2d12';
    });
  }

  /**
   * Salva as configurações do modal
   */
  async function salvarConfiguracoesModal(userId) {
    const accountId = getAccountId();

    const attrs = {
      whatsapp: document.getElementById('profluxus-modal-whatsapp').value.trim(),
      uso_profluxus: document.getElementById('profluxus-modal-uso').value,
      chave_openai: document.getElementById('profluxus-modal-chave-openai').value.trim(),
      prompt_openai: document.getElementById('profluxus-modal-prompt-openai').value.trim(),
      documento: document.getElementById('profluxus-modal-documento').value.trim(),
      api_openai: {
        url: document.getElementById('profluxus-modal-api-url').value.trim(),
        method: document.getElementById('profluxus-modal-api-method').value
      }
    };

    const messageDiv = document.getElementById('profluxus-modal-message');
    const messageP = messageDiv.querySelector('p');

    try {
      messageDiv.style.display = 'none';

      const agente = agentesCache[userId];

      if (!agente) {
        throw new Error('Agente não encontrado no cache');
      }

      const updatedAttrs = setProFluxusAttrs(
        agente.custom_attributes || {},
        accountId,
        attrs
      );

      await updateUserAttributes(accountId, userId, updatedAttrs);

      agente.custom_attributes = updatedAttrs;

      messageP.textContent = '✅ Configurações salvas com sucesso!';
      messageP.style.backgroundColor = '#d1fae5';
      messageP.style.color = '#065f46';
      messageDiv.style.display = 'block';

      console.log('✅ Configurações ProFluxus salvas para usuário:', userId);

      setTimeout(() => {
        fecharModal();
      }, 1500);

    } catch (error) {
      console.error('❌ Erro ao salvar configurações:', error);

      messageP.textContent = '❌ Erro ao salvar configurações. Tente novamente.';
      messageP.style.backgroundColor = '#fee2e2';
      messageP.style.color = '#991b1b';
      messageDiv.style.display = 'block';
    }
  }

  /**
   * Fecha o modal
   */
  function fecharModal() {
    const modal = document.getElementById('profluxus-modal');
    if (modal) {
      modal.style.display = 'none';
    }
  }

            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            color: #9ca3af;
            background-color: #f9fafb;
            cursor: not-allowed;
          "
        >
          ${CONFIG.opcoes_uso.map(opt => `
            <option value="${opt.value}" ${opt.value === attrs.uso_profluxus ? 'selected' : ''}>
              ${opt.label}
            </option>
          `).join('')}
        </select>
        <p style="font-size: 12px; color: #6b7280; margin-top: 6px;">
          Somente administradores podem alterar
        </p>
      </div>

      <button
        type="button"
        id="profluxus-salvar-perfil"
        style="
          padding: 10px 20px;
          background-color: #7c2d12;
          color: white;
          border: none;
          border-radius: 6px;
          font-size: 14px;
          font-weight: 500;
          cursor: pointer;
          transition: background-color 0.2s;
        "
        onmouseover="this.style.backgroundColor='#991b1b'"
        onmouseout="this.style.backgroundColor='#7c2d12'"
      >
        Salvar Configurações
      </button>

      <div id="profluxus-message" style="margin-top: 12px; display: none;">
        <p style="font-size: 14px; padding: 10px; border-radius: 6px;"></p>
      </div>
    `;

    container.appendChild(section);

    document.getElementById('profluxus-salvar-perfil').addEventListener('click', async () => {
      const whatsapp = document.getElementById('profluxus-whatsapp').value.trim();

      const messageDiv = document.getElementById('profluxus-message');
      const messageP = messageDiv.querySelector('p');

      try {
        messageDiv.style.display = 'none';

        const updatedAttrs = setProFluxusAttrs(
          userData.custom_attributes || {},
          accountId,
          {
            ...attrs,
            whatsapp: whatsapp
          }
        );

        await updateUserAttributes(accountId, userData.id, updatedAttrs);

        messageP.textContent = '✅ Configurações salvas com sucesso!';
        messageP.style.backgroundColor = '#d1fae5';
        messageP.style.color = '#065f46';
        messageDiv.style.display = 'block';

        userData.custom_attributes = updatedAttrs;
        currentUserData = userData;

        console.log('✅ Configurações ProFluxus salvas');

      } catch (error) {
        console.error('❌ Erro ao salvar configurações:', error);

        messageP.textContent = '❌ Erro ao salvar. Tente novamente.';
        messageP.style.backgroundColor = '#fee2e2';
        messageP.style.color = '#991b1b';
        messageDiv.style.display = 'block';
      }
    });

    console.log('✅ Seção ProFluxus adicionada ao perfil');
  }

  // ============================================================
  // INTERFACE - LISTA DE AGENTES
  // ============================================================

  async function carregarAgentes() {
    const accountId = getAccountId();
    if (!accountId) {
      return;
    }

    try {
      const agentes = await getAgents(accountId);

      agentes.forEach(agente => {
        agentesCache[agente.id] = agente;
      });

      console.log(`✅ ${agentes.length} agentes carregados no cache`);

    } catch (error) {
      console.error('❌ Erro ao carregar agentes:', error);
    }
  }

  function adicionarBotoesAgentes() {
    if (!window.location.pathname.includes('/settings/agents')) {
      return;
    }

    const accountId = getAccountId();
    if (!accountId) {
      return;
    }

    const todosElementos = document.querySelectorAll('*');
    const emailsEncontrados = new Set();

    todosElementos.forEach(el => {
      const texto = el.textContent || '';
      const emailRegex = /([a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+\.[a-zA-Z0-9_-]+)/g;
      const matches = texto.match(emailRegex);

      if (matches) {
        matches.forEach(email => {
          emailsEncontrados.add(email);
        });
      }
    });

    emailsEncontrados.forEach(email => {
      const agente = Object.values(agentesCache).find(a => a.email === email);

      if (agente) {
        adicionarBotaoParaAgente(agente);
      }
    });
  }

  function adicionarBotaoParaAgente(agente) {
    const todosElementos = document.querySelectorAll('*');

    for (const el of todosElementos) {
      const texto = el.textContent || '';

      if (texto.includes(agente.email)) {
        const elementoPai = el.closest('tr, div[class*="row"], div[class*="item"]');

        if (!elementoPai) {
          continue;
        }

        if (elementoPai.querySelector('.profluxus-config-btn')) {
          continue;
        }

        const btnContainer = document.createElement('div');
        btnContainer.style.cssText = 'display: inline-block; margin-left: 8px;';

        const btn = document.createElement('button');
        btn.className = 'profluxus-config-btn';
        btn.innerHTML = '📱';
        btn.title = 'Configurar ProFluxus';
        btn.style.cssText = `
          padding: 6px 10px;
          background-color: #7c2d12;
          color: white;
          border: none;
          border-radius: 4px;
          font-size: 16px;
          cursor: pointer;
          transition: background-color 0.2s;
        `;

        btn.addEventListener('mouseover', () => {
          btn.style.backgroundColor = '#991b1b';
        });

        btn.addEventListener('mouseout', () => {
          btn.style.backgroundColor = '#7c2d12';
        });

        btn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();

          abrirModal(agente.id, agente.name || agente.available_name);
        });

        btnContainer.appendChild(btn);

        if (el.parentNode) {
          el.parentNode.appendChild(btnContainer);
        }

        break;
      }
    }
  }

  // ============================================================
  // INICIALIZAÇÃO
  // ============================================================

  async function iniciar() {
    console.log('🚀 Inicializando ProFluxus Config...');

    criarModal();

    await new Promise(resolve => setTimeout(resolve, 1000));

    await adicionarSecaoPerfil();

    if (window.location.pathname.includes('/settings/agents')) {
      await carregarAgentes();
      await new Promise(resolve => setTimeout(resolve, 500));
      adicionarBotoesAgentes();
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', iniciar);
  } else {
    iniciar();
  }

  const observer = new MutationObserver(() => {
    adicionarSecaoPerfil();
    adicionarBotoesAgentes();
  });

  observer.observe(document.body, {
    childList: true,
    subtree: true
  });

  console.log('✨ ProFluxus Config pronto!');

})();
</script>
