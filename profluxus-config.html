<script>
(function() {
  'use strict';

  // ============================================================
  // PROFLUXUS CONFIG - SEM API CHATWOOT
  // ============================================================
  // Gerencia configurações ProFluxus usando APENAS a API ProFluxus
  // Funciona apenas na lista de agentes (/settings/agents)
  // ============================================================

  console.log('📱 ProFluxus Config carregado!');

  // ============================================================
  // CONFIGURAÇÕES
  // ============================================================

  const CONFIG = {
    opcoes_uso: [
      { value: 'receber_leads', label: 'Receber Leads' },
      { value: 'notificacoes_profluxus', label: 'Notificações ProFluxus' }
    ],
    metodos_api: [
      { value: 'POST', label: 'POST' },
      { value: 'GET', label: 'GET' }
    ]
  };

  // API Token do ProFluxus
  const PROFLUXUS_API_TOKEN = 'oT4hMJhLrpeVmqZdHpcsY9Nr';

  // ============================================================
  // FUNÇÕES DE API - APENAS PROFLUXUS
  // ============================================================

  /**
   * Pega o account_id da URL atual
   */
  function getAccountId() {
    const match = window.location.pathname.match(/\/accounts\/(\d+)/);
    return match ? match[1] : null;
  }

  /**
   * Faz uma chamada para a API ProFluxus
   */
  async function profluxusAPI(endpoint, method = 'GET', data = null) {
    const baseURL = window.location.origin;

    const options = {
      method: method,
      headers: {
        'Content-Type': 'application/json',
        'api_access_token': PROFLUXUS_API_TOKEN
      },
      credentials: 'include'
    };

    if (data && (method === 'POST' || method === 'PUT' || method === 'PATCH')) {
      options.body = JSON.stringify(data);
    }

    console.log('🌐 ProFluxus API:', method, endpoint);

    const response = await fetch(`${baseURL}${endpoint}`, options);

    if (!response.ok) {
      console.error('❌ Erro na API ProFluxus:', response.status, response.statusText);
      throw new Error(`API Error: ${response.status}`);
    }

    return await response.json();
  }

  /**
   * Busca os dados do usuário via API ProFluxus
   */
  async function getUserProFluxus(userId) {
    return await profluxusAPI(`/platform/api/v1/users/${userId}`);
  }

  /**
   * Atualiza os custom_attributes do usuário via API ProFluxus
   */
  async function updateUserAttributes(userId, customAttributes) {
    const updatedData = {
      custom_attributes: customAttributes
    };

    return await profluxusAPI(
      `/platform/api/v1/users/${userId}`,
      'PATCH',
      updatedData
    );
  }

  // ============================================================
  // FUNÇÕES DE ATRIBUTOS
  // ============================================================

  /**
   * Pega todos os atributos do ProFluxus
   */
  function getProFluxusAttrs(customAttributes, accountId) {
    const key = `account_${accountId}`;

    const defaults = {
      whatsapp: '',
      uso_profluxus: 'receber_leads',
      chave_openai: '',
      prompt_openai: '',
      documento: '',
      api_openai: {
        url: '',
        method: 'POST'
      }
    };

    if (!customAttributes) {
      return defaults;
    }

    const accountData = customAttributes[key] || {};

    const globalData = {
      whatsapp: customAttributes.whatsapp || '',
      uso_profluxus: customAttributes.uso_profluxus || 'receber_leads',
      chave_openai: customAttributes.chave_openai || '',
      prompt_openai: customAttributes.prompt_openai || '',
      documento: customAttributes.documento || '',
      api_openai: customAttributes.api_openai || { url: '', method: 'POST' }
    };

    return {
      whatsapp: accountData.whatsapp || globalData.whatsapp || defaults.whatsapp,
      uso_profluxus: accountData.uso_profluxus || globalData.uso_profluxus || defaults.uso_profluxus,
      chave_openai: globalData.chave_openai || defaults.chave_openai,
      prompt_openai: globalData.prompt_openai || defaults.prompt_openai,
      documento: globalData.documento || defaults.documento,
      api_openai: {
        url: (globalData.api_openai && globalData.api_openai.url) || defaults.api_openai.url,
        method: (globalData.api_openai && globalData.api_openai.method) || defaults.api_openai.method
      }
    };
  }

  /**
   * Atualiza os atributos do ProFluxus
   */
  function setProFluxusAttrs(customAttributes, accountId, attrs) {
    const key = `account_${accountId}`;

    const updated = { ...customAttributes };

    updated[key] = {
      whatsapp: attrs.whatsapp,
      uso_profluxus: attrs.uso_profluxus
    };

    updated.chave_openai = attrs.chave_openai;
    updated.prompt_openai = attrs.prompt_openai;
    updated.documento = attrs.documento;
    updated.api_openai = {
      url: attrs.api_openai.url,
      method: attrs.api_openai.method
    };

    return updated;
  }

  // ============================================================
  // MODAL DE EDIÇÃO
  // ============================================================

  /**
   * Cria o modal de edição
   */
  function criarModal() {
    if (document.getElementById('profluxus-modal')) {
      return;
    }

    const modal = document.createElement('div');
    modal.id = 'profluxus-modal';
    modal.style.cssText = `
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 10000;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      padding: 20px;
    `;

    modal.innerHTML = `
      <div id="profluxus-modal-content" style="
        background-color: white;
        border-radius: 12px;
        padding: 32px;
        max-width: 600px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      ">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
          <h2 style="font-size: 24px; font-weight: 700; color: #111827; margin: 0;">
            Configurações ProFluxus
          </h2>
          <button id="profluxus-modal-close" style="
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #6b7280;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: background-color 0.2s;
          " onmouseover="this.style.backgroundColor='#f3f4f6'" onmouseout="this.style.backgroundColor='transparent'">
            ×
          </button>
        </div>

        <div style="margin-bottom: 20px;">
          <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #374151;">
            Agente
          </label>
          <input
            type="text"
            id="profluxus-modal-nome"
            disabled
            style="
              width: 100%;
              padding: 10px 12px;
              border: 1px solid #d1d5db;
              border-radius: 6px;
              font-size: 14px;
              color: #6b7280;
              background-color: #f9fafb;
            "
          />
          <input type="hidden" id="profluxus-modal-userid" />
        </div>

        <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 24px 0;">

        <h3 style="font-size: 16px; font-weight: 600; color: #111827; margin-bottom: 16px;">
          Notificações WhatsApp
        </h3>

        <div style="margin-bottom: 20px;">
          <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #374151;">
            WhatsApp
          </label>
          <input
            type="tel"
            id="profluxus-modal-whatsapp"
            placeholder="+55 31 99999-9999"
            style="
              width: 100%;
              padding: 10px 12px;
              border: 1px solid #d1d5db;
              border-radius: 6px;
              font-size: 14px;
              color: #111827;
              background-color: white;
            "
          />
        </div>

        <div style="margin-bottom: 20px;">
          <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #374151;">
            Tipo de Uso
          </label>
          <select
            id="profluxus-modal-uso"
            style="
              width: 100%;
              padding: 10px 12px;
              border: 1px solid #d1d5db;
              border-radius: 6px;
              font-size: 14px;
              color: #111827;
              background-color: white;
            "
          >
            ${CONFIG.opcoes_uso.map(opt => `
              <option value="${opt.value}">${opt.label}</option>
            `).join('')}
          </select>
        </div>

        <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 24px 0;">

        <h3 style="font-size: 16px; font-weight: 600; color: #111827; margin-bottom: 16px;">
          API de Atualização de Consultor
        </h3>

        <div style="margin-bottom: 20px;">
          <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #374151;">
            URL da API
          </label>
          <input
            type="url"
            id="profluxus-modal-api-url"
            placeholder="https://api.exemplo.com/consultor"
            style="
              width: 100%;
              padding: 10px 12px;
              border: 1px solid #d1d5db;
              border-radius: 6px;
              font-size: 14px;
              color: #111827;
              background-color: white;
            "
          />
          <p style="font-size: 12px; color: #6b7280; margin-top: 6px;">
            Endpoint para atualizar dados do consultor
          </p>
        </div>

        <div style="margin-bottom: 20px;">
          <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #374151;">
            Método HTTP
          </label>
          <select
            id="profluxus-modal-api-method"
            style="
              width: 100%;
              padding: 10px 12px;
              border: 1px solid #d1d5db;
              border-radius: 6px;
              font-size: 14px;
              color: #111827;
              background-color: white;
            "
          >
            ${CONFIG.metodos_api.map(opt => `
              <option value="${opt.value}">${opt.label}</option>
            `).join('')}
          </select>
        </div>

        <div style="margin-bottom: 20px;">
          <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #374151;">
            Chave de API (Access Token)
          </label>
          <input
            type="text"
            id="profluxus-modal-chave-openai"
            placeholder="oT4hMJhLrpeVmqZdHpcsY9Nr"
            style="
              width: 100%;
              padding: 10px 12px;
              border: 1px solid #d1d5db;
              border-radius: 6px;
              font-size: 14px;
              color: #111827;
              background-color: white;
              font-family: monospace;
            "
          />
          <p style="font-size: 12px; color: #6b7280; margin-top: 6px;">
            Token de autenticação da API
          </p>
        </div>

        <div style="margin-bottom: 20px;">
          <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #374151;">
            Dados Adicionais (Prompt)
          </label>
          <textarea
            id="profluxus-modal-prompt-openai"
            placeholder="Informações adicionais..."
            rows="3"
            style="
              width: 100%;
              padding: 10px 12px;
              border: 1px solid #d1d5db;
              border-radius: 6px;
              font-size: 14px;
              color: #111827;
              background-color: white;
              resize: vertical;
              font-family: inherit;
            "
          ></textarea>
        </div>

        <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 24px 0;">

        <h3 style="font-size: 16px; font-weight: 600; color: #111827; margin-bottom: 16px;">
          Dados Adicionais
        </h3>

        <div style="margin-bottom: 20px;">
          <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #374151;">
            Documento (CPF/CNPJ)
          </label>
          <input
            type="text"
            id="profluxus-modal-documento"
            placeholder="00000000000"
            style="
              width: 100%;
              padding: 10px 12px;
              border: 1px solid #d1d5db;
              border-radius: 6px;
              font-size: 14px;
              color: #111827;
              background-color: white;
            "
          />
        </div>

        <div id="profluxus-modal-message" style="margin-bottom: 20px; display: none;">
          <p style="font-size: 14px; padding: 10px; border-radius: 6px; margin: 0;"></p>
        </div>

        <div style="display: flex; gap: 12px; justify-content: flex-end;">
          <button id="profluxus-modal-cancelar" style="
            padding: 10px 20px;
            background-color: #f3f4f6;
            color: #374151;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
          " onmouseover="this.style.backgroundColor='#e5e7eb'" onmouseout="this.style.backgroundColor='#f3f4f6'">
            Cancelar
          </button>
          <button id="profluxus-modal-salvar" style="
            padding: 10px 20px;
            background-color: #7c2d12;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
          " onmouseover="this.style.backgroundColor='#991b1b'" onmouseout="this.style.backgroundColor='#7c2d12'">
            Salvar Configurações
          </button>
        </div>
      </div>
    `;

    document.body.appendChild(modal);

    document.getElementById('profluxus-modal-close').addEventListener('click', fecharModal);
    document.getElementById('profluxus-modal-cancelar').addEventListener('click', fecharModal);
    document.getElementById('profluxus-modal-salvar').addEventListener('click', salvarConfiguracoesModal);

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        fecharModal();
      }
    });
  }

  /**
   * Abre o modal para editar um agente
   */
  async function abrirModal(userId, userName) {
    criarModal();

    const modal = document.getElementById('profluxus-modal');
    const accountId = getAccountId();

    const messageDiv = document.getElementById('profluxus-modal-message');
    const messageP = messageDiv.querySelector('p');

    try {
      messageDiv.style.display = 'none';

      console.log('🔍 Buscando dados do usuário:', userId);

      // Busca os dados via API ProFluxus
      const userData = await getUserProFluxus(userId);

      console.log('✅ Dados recebidos:', userData);

      const attrs = getProFluxusAttrs(userData.custom_attributes, accountId);

      // Preenche os campos
      document.getElementById('profluxus-modal-userid').value = userId;
      document.getElementById('profluxus-modal-nome').value = userName;
      document.getElementById('profluxus-modal-whatsapp').value = attrs.whatsapp;
      document.getElementById('profluxus-modal-uso').value = attrs.uso_profluxus;
      document.getElementById('profluxus-modal-chave-openai').value = attrs.chave_openai;
      document.getElementById('profluxus-modal-prompt-openai').value = attrs.prompt_openai;
      document.getElementById('profluxus-modal-api-url').value = attrs.api_openai.url;
      document.getElementById('profluxus-modal-api-method').value = attrs.api_openai.method;
      document.getElementById('profluxus-modal-documento').value = attrs.documento;

      modal.style.display = 'flex';

    } catch (error) {
      console.error('❌ Erro ao abrir modal:', error);

      messageP.textContent = '❌ Erro ao carregar dados do usuário. Tente novamente.';
      messageP.style.backgroundColor = '#fee2e2';
      messageP.style.color = '#991b1b';
      messageDiv.style.display = 'block';

      setTimeout(() => {
        messageDiv.style.display = 'none';
      }, 3000);
    }
  }

  /**
   * Salva as configurações do modal
   */
  async function salvarConfiguracoesModal() {
    const accountId = getAccountId();
    const userId = document.getElementById('profluxus-modal-userid').value;

    const attrs = {
      whatsapp: document.getElementById('profluxus-modal-whatsapp').value.trim(),
      uso_profluxus: document.getElementById('profluxus-modal-uso').value,
      chave_openai: document.getElementById('profluxus-modal-chave-openai').value.trim(),
      prompt_openai: document.getElementById('profluxus-modal-prompt-openai').value.trim(),
      documento: document.getElementById('profluxus-modal-documento').value.trim(),
      api_openai: {
        url: document.getElementById('profluxus-modal-api-url').value.trim(),
        method: document.getElementById('profluxus-modal-api-method').value
      }
    };

    const messageDiv = document.getElementById('profluxus-modal-message');
    const messageP = messageDiv.querySelector('p');

    try {
      messageDiv.style.display = 'none';

      console.log('💾 Salvando configurações para usuário:', userId);

      // Busca dados atuais
      const currentData = await getUserProFluxus(userId);

      // Atualiza atributos
      const updatedAttrs = setProFluxusAttrs(
        currentData.custom_attributes || {},
        accountId,
        attrs
      );

      // Salva via API ProFluxus
      await updateUserAttributes(userId, updatedAttrs);

      messageP.textContent = '✅ Configurações salvas com sucesso!';
      messageP.style.backgroundColor = '#d1fae5';
      messageP.style.color = '#065f46';
      messageDiv.style.display = 'block';

      console.log('✅ Configurações ProFluxus salvas');

      setTimeout(() => {
        fecharModal();
      }, 1500);

    } catch (error) {
      console.error('❌ Erro ao salvar configurações:', error);

      messageP.textContent = '❌ Erro ao salvar configurações. Tente novamente.';
      messageP.style.backgroundColor = '#fee2e2';
      messageP.style.color = '#991b1b';
      messageDiv.style.display = 'block';
    }
  }

  /**
   * Fecha o modal
   */
  function fecharModal() {
    const modal = document.getElementById('profluxus-modal');
    if (modal) {
      modal.style.display = 'none';
    }
  }

  // ============================================================
  // INTERFACE - LISTA DE AGENTES
  // ============================================================

  /**
   * Detecta agentes na página pela presença de links
   */
  function detectarAgentes() {
    if (!window.location.pathname.includes('/settings/agents')) {
      return;
    }

    console.log('🔍 Detectando agentes na página...');

    // Procura por links de perfil de agentes
    const links = document.querySelectorAll('a[href*="/profile/"]');

    links.forEach(link => {
      const href = link.getAttribute('href');
      const match = href.match(/\/profile\/(\d+)/);

      if (match) {
        const userId = match[1];
        const userName = link.textContent.trim();

        adicionarBotaoParaAgente(link, userId, userName);
      }
    });
  }

  /**
   * Adiciona botão de configuração para um agente
   */
  function adicionarBotaoParaAgente(linkElement, userId, userName) {
    // Procura o elemento pai (linha da tabela ou card)
    const elementoPai = linkElement.closest('tr, div[class*="row"], div[class*="item"], div[class*="agent"]');

    if (!elementoPai) {
      return;
    }

    // Evita duplicar o botão
    if (elementoPai.querySelector('.profluxus-config-btn')) {
      return;
    }

    const btnContainer = document.createElement('div');
    btnContainer.style.cssText = 'display: inline-block; margin-left: 8px;';

    const btn = document.createElement('button');
    btn.className = 'profluxus-config-btn';
    btn.innerHTML = '📱';
    btn.title = 'Configurar ProFluxus';
    btn.style.cssText = `
      padding: 6px 10px;
      background-color: #7c2d12;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.2s;
    `;

    btn.addEventListener('mouseover', () => {
      btn.style.backgroundColor = '#991b1b';
    });

    btn.addEventListener('mouseout', () => {
      btn.style.backgroundColor = '#7c2d12';
    });

    btn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();

      abrirModal(userId, userName);
    });

    btnContainer.appendChild(btn);

    // Adiciona o botão ao lado do link
    if (linkElement.parentNode) {
      linkElement.parentNode.appendChild(btnContainer);
    }

    console.log('✅ Botão adicionado para:', userName);
  }

  // ============================================================
  // INICIALIZAÇÃO
  // ============================================================

  async function iniciar() {
    console.log('🚀 Inicializando ProFluxus Config...');

    criarModal();

    await new Promise(resolve => setTimeout(resolve, 1000));

    if (window.location.pathname.includes('/settings/agents')) {
      detectarAgentes();
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', iniciar);
  } else {
    iniciar();
  }

  // Observer para detectar novos agentes
  const observer = new MutationObserver(() => {
    detectarAgentes();
  });

  observer.observe(document.body, {
    childList: true,
    subtree: true
  });

  console.log('✨ ProFluxus Config pronto!');

})();
</script>
